<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08090c" />
    <title>voiXPe3per Cloud • Direct Pair & Discord</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="matrix-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="pairing-container">
      <div class="header-badge">
        <div class="radar-ping">
          <div class="wave"></div>
          <div class="core"></div>
        </div>
        <span>voiXPe3per Cloud Backend</span>
      </div>

      <div class="discord-account-panel" id="discordPanel" style="margin-bottom: 20px; background: rgba(88, 101, 242, 0.1); border: 1px solid rgba(88, 101, 242, 0.3); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 36px; height: 36px; border-radius: 50%; background: #5865f2; display: grid; place-items: center; overflow: hidden;" id="userAvatarContainer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
              <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.894a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
          </div>
          <div>
            <div id="discordUsername" style="font-size: 13px; font-weight: 700; color: #fff;">Belum Terhubung Discord</div>
            <div id="discordSub" style="font-size: 11px; color: #8e9db2;">Login untuk sync trusted cloud device</div>
          </div>
        </div>
        <button id="discordBtn" type="button" style="background: #5865f2; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <span>Login</span>
        </button>
      </div>

      <h1 class="title">
        <span>voiXPe3per Cloud</span>
      </h1>
      <p class="subtitle" id="summary">
        Hubungkan iPhone / iOS ke desktop Windows melalui cloud relay global persisten.
      </p>

      <div class="sync-visual">
        <svg class="svg-diagram" viewBox="0 0 360 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cyberLineGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#5865f2" />
              <stop offset="50%" stop-color="#06b6d4" />
              <stop offset="100%" stop-color="#10b981" />
            </linearGradient>
          </defs>
          <line x1="60" y1="55" x2="300" y2="55" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-linecap="round" />
          <line id="streamBeam" x1="60" y1="55" x2="300" y2="55" stroke="url(#cyberLineGrad)" stroke-width="3" stroke-linecap="round" class="stream-pulse" />

          <g transform="translate(180, 55)">
            <circle r="16" fill="#0f1217" stroke="#232a36" stroke-width="2" />
            <circle id="syncCoreGlow" r="8" fill="#5865f2" class="node-pulse-circle" opacity="0.9" />
            <path d="M-4 -2L0 -6L4 -2M4 2L0 6L-4 2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </g>

          <g transform="translate(25, 20)">
            <rect width="36" height="70" rx="8" fill="#151922" stroke="#06b6d4" stroke-width="2" />
            <rect x="3" y="6" width="30" height="58" rx="5" fill="#08090c" />
            <rect x="12" y="8" width="12" height="3" rx="1.5" fill="#5865f2" />
            <rect x="7" y="24" width="22" height="2" rx="1" fill="#06b6d4" opacity="0.6" />
            <rect x="7" y="30" width="16" height="2" rx="1" fill="#06b6d4" opacity="0.4" />
            <text x="18" y="82" fill="#8e9db2" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">iOS Client</text>
          </g>

          <g transform="translate(285, 22)">
            <path d="M19 50L13 65H35L29 50" fill="#232a36" />
            <rect x="10" y="64" width="28" height="3" rx="1.5" fill="#5865f2" opacity="0.6" />
            <rect width="48" height="38" rx="5" fill="#151922" stroke="#10b981" stroke-width="2" />
            <rect x="3" y="3" width="42" height="32" rx="3" fill="#08090c" />
            <circle cx="8" cy="8" r="1.5" fill="#f43f5e" />
            <circle cx="13" cy="8" r="1.5" fill="#f59e0b" />
            <circle cx="18" cy="8" r="1.5" fill="#10b981" />
            <rect x="7" y="15" width="24" height="2" rx="1" fill="#10b981" opacity="0.7" />
            <rect x="7" y="21" width="32" height="2" rx="1" fill="#5865f2" opacity="0.5" />
            <text x="24" y="80" fill="#8e9db2" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">Cloud PC</text>
          </g>
        </svg>
      </div>

      <div class="meta-grid">
        <div class="meta-box">
          <div class="meta-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            </svg>
            Room Channel
          </div>
          <div class="meta-value" id="room">-</div>
        </div>

        <div class="meta-box">
          <div class="meta-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
              <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            </svg>
            Cloud Relay
          </div>
          <div class="meta-value" id="relay">-</div>
        </div>
      </div>

      <div class="status-pill-banner" id="statusBanner">
        <div class="status-icon-wrap" id="statusIconWrap">
          <svg id="statusIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="status-details">
          <div class="status-badge-title">Status Koneksi</div>
          <div class="status-text" id="status">Siap Pairing</div>
        </div>
      </div>

      <button class="btn-pair" id="allow" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Izinkan Pairing</span>
      </button>

      <div class="security-footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Discord OAuth2 &amp; Cloud Authenticated Node</span>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const payload = {
        mode: params.get("mode") || "relay",
        relay: params.get("relay") || "",
        public: params.get("public") || "",
        room: params.get("room") || "",
        host: params.get("host") || "",
        port: Number(params.get("port") || 8080),
        token: params.get("token") || ""
      };

      const discordKey = "voixpe3per.discord.user";
      const tokenKey = "voixpe3per.discord.token";
      const identityKey = "voixpe3per.web.identity";
      const trustedKey = "voixpe3per.web.trusted";

      const statusEl = document.getElementById("status");
      const statusBanner = document.getElementById("statusBanner");
      const statusIconWrap = document.getElementById("statusIconWrap");
      const statusIcon = document.getElementById("statusIcon");
      const allowButton = document.getElementById("allow");
      const discordBtn = document.getElementById("discordBtn");
      const discordUsername = document.getElementById("discordUsername");
      const discordSub = document.getElementById("discordSub");
      const userAvatarContainer = document.getElementById("userAvatarContainer");

      let socket = null;
      let pairTimer = null;
      let pairingDone = false;

      document.getElementById("room").textContent = payload.room || "Global Room";
      const relayDisplay = payload.relay || payload.public;
      if (relayDisplay) {
        try {
          const parsed = new URL(relayDisplay.startsWith("ws") ? relayDisplay.replace(/^ws/, "http") : relayDisplay);
          document.getElementById("relay").textContent = parsed.hostname;
        } catch {
          document.getElementById("relay").textContent = relayDisplay;
        }
      } else {
        document.getElementById("relay").textContent = "Cloud Relay WSS";
      }

      // Check Discord login state
      setupDiscordAuth();
      allowButton.addEventListener("click", allowPairing);

      function setupDiscordAuth() {
        const savedUser = loadJSON(discordKey);
        if (savedUser) {
          showDiscordUser(savedUser);
        }

        const code = params.get("code");
        if (code) {
          exchangeDiscordCode(code);
        }

        discordBtn.addEventListener("click", () => {
          if (loadJSON(discordKey)) {
            localStorage.removeItem(discordKey);
            localStorage.removeItem(tokenKey);
            location.reload();
          } else {
            loginWithDiscord();
          }
        });
      }

      function showDiscordUser(user) {
        discordUsername.textContent = user.globalName || user.username;
        discordSub.textContent = `Discord ID: ${user.id}`;
        discordBtn.textContent = "Logout";
        discordBtn.style.background = "#2a3038";
        if (user.avatar) {
          userAvatarContainer.innerHTML = `<img src="${user.avatar}" style="width: 100%; height: 100%; object-fit: cover;" alt="Avatar" />`;
        }
      }

      function loginWithDiscord() {
        const relayHost = payload.relay || payload.public || "wss://voixpe3per-relay.onrender.com/ws";
        const httpBase = relayHost.replace(/^wss:/, "https:").replace(/^ws:/, "http:").replace(/\/ws$/, "");
        const redirect = window.location.origin + window.location.pathname;
        
        fetch(`${httpBase}/api/auth/discord/url?redirect_uri=${encodeURIComponent(redirect)}`)
          .then(res => res.json())
          .then(data => {
            if (data.url) {
              window.location.href = data.url;
            }
          })
          .catch(() => {
            // Mock fallback development login
            const mock = {
              id: "8899776655",
              username: "Discord Pilot",
              globalName: "voiXPe3per iOS User",
              avatar: null
            };
            localStorage.setItem(discordKey, JSON.stringify(mock));
            showDiscordUser(mock);
          });
      }

      function exchangeDiscordCode(code) {
        const relayHost = payload.relay || payload.public || "wss://voixpe3per-relay.onrender.com/ws";
        const httpBase = relayHost.replace(/^wss:/, "https:").replace(/^ws:/, "http:").replace(/\/ws$/, "");
        const redirect = window.location.origin + window.location.pathname;

        fetch(`${httpBase}/api/auth/discord/callback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, redirect_uri: redirect })
        })
          .then(res => res.json())
          .then(data => {
            if (data.user) {
              localStorage.setItem(discordKey, JSON.stringify(data.user));
              localStorage.setItem(tokenKey, data.token);
              showDiscordUser(data.user);
            }
          })
          .catch(() => {});
      }

      function allowPairing() {
        pairingDone = false;
        allowButton.disabled = true;
        setConnecting("Menghubungkan ke Cloud Backend...");

        let wsUrl;
        try {
          wsUrl = websocketUrl(payload);
        } catch (error) {
          setFailed(error.message);
          return;
        }

        socket = new WebSocket(wsUrl);
        socket.addEventListener("open", () => {
          setConnecting("Menunggu desktop menerima pairing...");
          const token = localStorage.getItem(tokenKey);
          if (token) {
            socket.send(JSON.stringify({ type: "auth.session", token }));
          }
          if (payload.mode === "relay") {
            socket.send(JSON.stringify({ type: "relay.join", role: "web", room: payload.room }));
          }
          sendPairVerify();
          pairTimer = window.setInterval(sendPairVerify, 2000);
        });

        socket.addEventListener("message", (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch {
            return;
          }

          if (message.type === "pair.success") {
            pairingDone = true;
            window.clearInterval(pairTimer);
            localStorage.setItem(
              trustedKey,
              JSON.stringify({
                mode: payload.mode,
                host: payload.host,
                port: payload.port,
                relay: payload.relay,
                room: payload.room,
                deviceId: message.deviceId,
                trustSecret: message.trustSecret
              })
            );
            setSuccess("Cloud Pairing Berhasil!");
            allowButton.classList.add("success");
            allowButton.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>Pairing Sukses • Cloud Synced</span>
            `;
            return;
          }

          if (message.type === "pair.failed" || message.type === "error" || message.type === "relay.error") {
            setFailed(message.message || "Pairing ditolak oleh desktop.");
          }
        });

        socket.addEventListener("close", () => {
          window.clearInterval(pairTimer);
          if (!pairingDone) {
            setFailed("Koneksi cloud terputus. Pastikan desktop masih aktif.");
          }
        });

        socket.addEventListener("error", () => {
          setFailed("Gagal terhubung ke Cloud Relay WebSocket.");
        });
      }

      function sendPairVerify() {
        if (!socket || socket.readyState !== WebSocket.OPEN || pairingDone) {
          return;
        }

        const discordUser = loadJSON(discordKey);
        socket.send(
          JSON.stringify({
            type: "pair.verify",
            token: payload.token,
            room: payload.room,
            device: deviceIdentity(discordUser),
            capabilities: {
              encoder: "none",
              maxFps: 0,
              canStream: false,
              pairingOnly: true
            }
          })
        );
      }

      function websocketUrl(data) {
        const url = data.relay || data.public;
        if (!url) {
          throw new Error("Payload QR tidak memiliki URL Cloud WSS.");
        }
        if (!url.startsWith("wss://")) {
          throw new Error("Koneksi cloud membutuhkan alamat wss://.");
        }
        return url;
      }

      function deviceIdentity(discordUser) {
        const existing = loadJSON(identityKey);
        const detected = detectDevice();
        const id = existing?.id || `${detected.platform}-cloud-${randomId()}`;
        const name = discordUser ? `${discordUser.globalName || discordUser.username} (${detected.name})` : detected.name;
        const identity = {
          id,
          name,
          model: detected.model,
          manufacturer: detected.manufacturer,
          platform: detected.platform,
          osName: detected.osName,
          osVersion: detected.osVersion
        };
        localStorage.setItem(identityKey, JSON.stringify(identity));
        return identity;
      }

      function detectDevice() {
        const ua = navigator.userAgent || "";
        const isiPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
        const isiOS = /iPad|iPhone|iPod/.test(ua) || isiPadOS;
        const osMatch = ua.match(/OS ([0-9_]+)/);
        const browser = /CriOS/.test(ua) ? "Chrome" : /FxiOS/.test(ua) ? "Firefox" : "Safari";

        if (isiOS) {
          const model = /iPad/.test(ua) || isiPadOS ? "iPad" : "iPhone";
          return {
            name: `${model} (${browser})`,
            model,
            manufacturer: "Apple",
            platform: "ios",
            osName: "iOS",
            osVersion: osMatch ? osMatch[1].replaceAll("_", ".") : "iOS"
          };
        }

        return {
          name: "Mobile Cloud Browser",
          model: navigator.platform || "Browser",
          manufacturer: "Cloud",
          platform: "web",
          osName: "Web",
          osVersion: "unknown"
        };
      }

      function setConnecting(msg) {
        statusEl.textContent = msg;
        statusBanner.className = "status-pill-banner connecting";
        statusIcon.setAttribute("stroke", "#06b6d4");
      }

      function setSuccess(msg) {
        statusEl.textContent = msg;
        statusBanner.className = "status-pill-banner connected";
        statusIcon.setAttribute("stroke", "#10b981");
        statusIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
      }

      function setFailed(msg) {
        window.clearInterval(pairTimer);
        allowButton.disabled = false;
        statusEl.textContent = msg;
        statusBanner.className = "status-pill-banner failed";
        statusIcon.setAttribute("stroke", "#f43f5e");
        statusIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
      }

      function loadJSON(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "null");
        } catch {
          return null;
        }
      }

      function randomId() {
        if (crypto.randomUUID) {
          return crypto.randomUUID().slice(0, 8);
        }
        return Math.random().toString(36).slice(2, 10);
      }
    </script>
  </body>
</html>
