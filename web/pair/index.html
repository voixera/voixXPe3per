<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#070807" />
    <title>PeeperPhone — Pair</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="brand-row">
        <div class="brand-mark">P</div>
        <span class="brand-name">PeeperPhone / Pair</span>
      </div>

      <!-- Discord account -->
      <div class="discord-panel">
        <div class="discord-id">
          <div class="avatar-ring" id="avatarRing">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
              <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.894a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
          </div>
          <div style="min-width:0">
            <div class="user-name" id="userName">Not connected</div>
            <div class="user-sub" id="userSub">Discord login required to approve pairing</div>
          </div>
        </div>
        <button class="logout-btn" id="authBtn" type="button">Login</button>
      </div>

      <h1 class="title" style="font-size:26px">
        Pairing terminal
      </h1>

      <div class="sync-visual panel scan-sweep">
        <svg viewBox="0 0 380 118" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="72" y1="50" x2="308" y2="50" stroke="#2c3325" stroke-width="2" />
          <line class="beam" x1="72" y1="50" x2="308" y2="50" stroke="#c6f542" stroke-width="2" />

          <g transform="translate(190, 50)">
            <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="#0e100d" stroke="#46503a" stroke-width="1.5" />
            <rect x="-3" y="-3" width="6" height="6" transform="rotate(45)" fill="#c6f542" />
          </g>

          <!-- source device: logo when desktop, phone outline when android/ios -->
          <g id="srcLogo">
            <rect x="30" y="28" width="44" height="44" fill="#12140f" stroke="#c6f542" stroke-width="1.5" />
            <text x="52" y="57" text-anchor="middle" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="bold" fill="#c6f542">P</text>
          </g>
          <g id="srcPhone" style="display:none">
            <rect x="38" y="16" width="28" height="68" rx="5" fill="#12140f" stroke="#46503a" stroke-width="1.5" />
            <rect x="41" y="21" width="22" height="58" rx="3" fill="#070807" />
            <circle cx="52" cy="74" r="1.8" fill="#46503a" />
          </g>
          <text id="srcLabel" x="52" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="2" fill="#7d8570">DESKTOP</text>

          <!-- target desktop -->
          <g id="dstDevice">
            <rect x="292" y="24" width="52" height="36" fill="#12140f" stroke="#46503a" stroke-width="1.5" />
            <rect x="296" y="28" width="44" height="28" fill="#070807" />
            <path d="M310 60h16l3 7h-22z" fill="#12140f" stroke="#46503a" stroke-width="1.5" />
            <rect x="300" y="32" width="20" height="2" fill="#c6f542" opacity="0.7" />
            <rect x="300" y="38" width="30" height="2" fill="#46503a" />
            <rect x="300" y="44" width="24" height="2" fill="#46503a" />
          </g>
          <text id="dstLabel" x="318" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="2" fill="#7d8570">YOUR DESKTOP</text>
        </svg>
      </div>

      <div class="meta-grid">
        <div class="meta-box">
          <div class="label-tech">Room Code</div>
          <div class="meta-value" id="roomCode">--------</div>
        </div>
        <div class="meta-box">
          <div class="label-tech">Backend</div>
          <div class="meta-value" id="backendName">Supabase</div>
        </div>
      </div>

      <div class="status-banner" id="statusBanner">
        <span class="led off" id="statusLed"></span>
        <div>
          <div class="label-tech">Status</div>
          <div class="status-text" id="statusText">Waiting for login<span class="cursor-blink"></span></div>
        </div>
      </div>

      <button class="btn-hard" id="allowBtn" type="button" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Approve Pairing</span>
      </button>

      <div class="footer-note label-tech">
        <span class="divider"></span>
        Discord OAuth2 / Supabase Row Security
        <span class="divider"></span>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const roomCode = (params.get("code") || params.get("room") || "").trim();

      const el = {
        userName: document.getElementById("userName"),
        userSub: document.getElementById("userSub"),
        avatarRing: document.getElementById("avatarRing"),
        authBtn: document.getElementById("authBtn"),
        room: document.getElementById("roomCode"),
        statusBanner: document.getElementById("statusBanner"),
        statusLed: document.getElementById("statusLed"),
        statusText: document.getElementById("statusText"),
        allowBtn: document.getElementById("allowBtn")
      };

      el.room.textContent = roomCode || "NO CODE";
      renderSourceDevice();

      const client = window.supabase.createClient(
        window.PEEPER_CONFIG.supabaseUrl,
        window.PEEPER_CONFIG.supabaseAnonKey,
        { auth: { detectSessionInUrl: true, flowType: "implicit", persistSession: true } }
      );

      let session = null;
      boot();

      async function boot() {
        const { data } = await client.auth.getSession();
        applySession(data.session);
        if (!roomCode) {
          setStatus("failed", "No room code in URL. Scan the QR from the desktop app again.");
        } else {
          setStatus(session ? "idle" : "idle", session ? "Ready. Tap approve to link this device." : "Login with Discord first.");
        }

        client.auth.onAuthStateChange((_event, s) => {
          const before = !!session;
          applySession(s);
          if (!before && session) {
            setStatus("idle", `Signed in as ${displayName()}. Ready to approve.`);
          }
        });

        el.authBtn.addEventListener("click", () => {
          if (session) {
            client.auth.signOut().then(() => applySession(null));
          } else {
            client.auth.signInWithOAuth({
              provider: "discord",
              options: { redirectTo: window.location.href }
            });
          }
        });

        el.allowBtn.addEventListener("click", approve);
      }

      function displayName(meta) {
        meta = meta || (session && session.user && session.user.user_metadata) || {};
        return meta.full_name || meta.name || meta.user_name || (session && session.user && session.user.email) || "User";
      }

      function applySession(s) {
        session = s;
        if (s) {
          const meta = s.user.user_metadata || {};
          const name = displayName(meta);
          el.userName.textContent = name;
          el.userSub.textContent = "Discord ID " + (meta.provider_id || s.user.id.slice(0, 8));
          const avatar = meta.avatar_url;
          if (avatar) {
            el.avatarRing.innerHTML = `<img src="${avatar}" alt="Avatar" />`;
          }
          el.authBtn.textContent = "Logout";
          el.allowBtn.disabled = false;
        } else {
          el.userName.textContent = "Not connected";
          el.userSub.textContent = "Discord login required to approve pairing";
          el.avatarRing.innerHTML =
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.894a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/></svg>';
          el.authBtn.textContent = "Login";
          el.allowBtn.disabled = true;
        }
      }

      async function approve() {
        if (!session || !roomCode) {
          setStatus("failed", "Need Discord login and a valid room code.");
          return;
        }
        el.allowBtn.disabled = true;

        setStatus("connecting", "Requesting camera & microphone access...");
        const mediaOK = await authorizeMedia();
        if (!mediaOK) {
          setStatus("failed", "Camera & mic are required for pairing. Allow both and try again.");
          el.allowBtn.disabled = false;
          return;
        }

        setStatus("connecting", "Permissions granted. Sending approval to Supabase cloud...");

        const identity = deviceIdentity();
        const { error } = await client
          .from("pairing_sessions")
          .update({
            device: identity,
            status: "approved",
            approved_at: new Date().toISOString()
          })
          .eq("code", roomCode)
          .eq("status", "waiting");

        if (error) {
          setStatus("failed", "Approval rejected: " + error.message);
          el.allowBtn.disabled = false;
          return;
        }

        setStatus("connected", "Paired with camera & mic authorized. Watch the desktop.");
        el.allowBtn.classList.add("success");
        el.allowBtn.innerHTML =
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Device Linked</span>';
      }

      // Pairing requires camera + microphone authorization up front.
      async function authorizeMedia() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return false;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          stream.getTracks().forEach((track) => track.stop());
          return true;
        } catch (err) {
          return false;
        }
      }

      function deviceIdentity() {
        const ua = navigator.userAgent || "";
        const isiPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
        const isiOS = /iPad|iPhone|iPod/.test(ua) || isiPadOS;
        const osMatch = ua.match(/OS ([0-9_]+)/);
        const browser = /CriOS/.test(ua) ? "Chrome" : /FxiOS/.test(ua) ? "Firefox" : /EdgiOS/.test(ua) ? "Edge" : "Safari";

        let platform = "web";
        let model = navigator.platform || "Browser";
        let manufacturer = "Unknown";
        let osName = "Web";
        let osVersion = "unknown";

        if (isiOS) {
          platform = "ios";
          model = /iPad/.test(ua) || isiPadOS ? "iPad" : "iPhone";
          manufacturer = "Apple";
          osName = "iOS";
          osVersion = osMatch ? osMatch[1].replaceAll("_", ".") : "unknown";
        } else if (/Android/i.test(ua)) {
          platform = "android";
          manufacturer = "Android";
          osName = "Android";
          const av = ua.match(/Android ([0-9.]+)/);
          osVersion = av ? av[1] : "unknown";
        }

        return {
          id: randomId(),
          name: `${displayName()} (${model} / ${browser})`,
          model,
          manufacturer,
          platform,
          osName,
          osVersion,
          streamCapable: false,
          cameraOk: true,
          micOk: true
        };
      }

      function setStateClass(state) {
        el.statusBanner.className = "status-banner" + (state !== "idle" ? " " + state : "");
        el.statusLed.className = "led " + (state === "connected" ? "on" : state === "connecting" ? "on" : "off");
      }

      function setStatus(state, message) {
        setStateClass(state);
        el.statusText.innerHTML = "";
        el.statusText.append(document.createTextNode(message));
        const cursor = document.createElement("span");
        cursor.className = "cursor-blink";
        el.statusText.append(cursor);
      }

      function randomId() {
        if (crypto.randomUUID) return crypto.randomUUID();
        return Math.random().toString(36).slice(2) + Date.now().toString(36);
      }

      // Diagram: show what is actually viewing this page.
      function renderSourceDevice() {
        const ua = navigator.userAgent || "";
        const isiPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
        const isIOS = /iPad|iPhone|iPod/.test(ua) || isiPadOS;
        const isAndroid = /Android/i.test(ua);

        const srcLogo = document.getElementById("srcLogo");
        const srcPhone = document.getElementById("srcPhone");
        const srcLabel = document.getElementById("srcLabel");

        if (isIOS || isAndroid) {
          srcLogo.style.display = "none";
          srcPhone.style.display = "";
          srcLabel.textContent = isIOS ? "iOS" : "ANDROID";
        } else {
          srcLogo.style.display = "";
          srcPhone.style.display = "none";
          srcLabel.textContent = "DESKTOP";
        }
      }
    </script>
  </body>
</html>
