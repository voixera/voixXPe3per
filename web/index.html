<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08090c" />
    <title>voiXPe3per • Portal Mirroring</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="matrix-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="pairing-container">
      <div class="header-badge">
        <div class="radar-ping">
          <div class="wave"></div>
          <div class="core"></div>
        </div>
        <span>voiXPe3per Core</span>
      </div>

      <h1 class="title">
        <span>Mirror Layar ke Desktop</span>
      </h1>
      <p class="subtitle">
        Portal web handshake instan. Scan kode QR langsung menggunakan kamera iOS atau Android untuk menyambungkan perangkat ke aplikasi desktop Windows.
      </p>

      <div class="sync-visual">
        <svg class="svg-diagram" viewBox="0 0 360 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cyberLineGradHome" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#06b6d4" />
              <stop offset="50%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#10b981" />
            </linearGradient>
          </defs>
          <line x1="60" y1="55" x2="300" y2="55" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-linecap="round" />
          <line x1="60" y1="55" x2="300" y2="55" stroke="url(#cyberLineGradHome)" stroke-width="3" stroke-linecap="round" class="stream-pulse" />

          <g transform="translate(180, 55)">
            <circle r="16" fill="#0f1217" stroke="#232a36" stroke-width="2" />
            <circle r="8" fill="#8b5cf6" class="node-pulse-circle" opacity="0.8" />
            <path d="M-4 -2L0 -6L4 -2M4 2L0 6L-4 2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </g>

          <g transform="translate(25, 20)">
            <rect width="36" height="70" rx="8" fill="#151922" stroke="#06b6d4" stroke-width="2" />
            <rect x="3" y="6" width="30" height="58" rx="5" fill="#08090c" />
            <rect x="12" y="8" width="12" height="3" rx="1.5" fill="#3b82f6" />
            <rect x="7" y="24" width="22" height="2" rx="1" fill="#06b6d4" opacity="0.6" />
            <text x="18" y="82" fill="#8e9db2" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">iOS/Android</text>
          </g>

          <g transform="translate(285, 22)">
            <path d="M19 50L13 65H35L29 50" fill="#232a36" />
            <rect x="10" y="64" width="28" height="3" rx="1.5" fill="#3b82f6" opacity="0.6" />
            <rect width="48" height="38" rx="5" fill="#151922" stroke="#10b981" stroke-width="2" />
            <rect x="3" y="3" width="42" height="32" rx="3" fill="#08090c" />
            <circle cx="8" cy="8" r="1.5" fill="#f43f5e" />
            <circle cx="13" cy="8" r="1.5" fill="#f59e0b" />
            <circle cx="18" cy="8" r="1.5" fill="#10b981" />
            <rect x="7" y="15" width="24" height="2" rx="1" fill="#10b981" opacity="0.7" />
            <text x="24" y="80" fill="#8e9db2" font-size="9" font-family="sans-serif" font-weight="600" text-anchor="middle">Desktop</text>
          </g>
        </svg>
      </div>

      <a class="btn-pair" href="/pair" style="text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
        <span>Buka Terminal Pairing</span>
      </a>
    </main>
  </body>
</html>
